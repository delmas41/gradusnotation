# Publish @gradusmusic/notation-mcp to npm with provenance.
#
# Triggered by pushing a version tag (e.g. `git tag v0.2.3 && git push origin v0.2.3`).
# Provenance attaches a signed statement to the published tarball linking it to
# the exact GitHub commit + workflow run, so installers can verify the package
# was built by this repo (visible as a "Provenance" badge on npmjs.com).
#
# Auth: OIDC trusted publishing — no NPM_TOKEN required.
#   - Configured once at https://www.npmjs.com/package/@gradusmusic/notation-mcp/access
#     → Trusted Publishing → Add → GitHub Actions → repo: delmas41/gradusnotation,
#     workflow filename: publish.yml.
#   - At publish time, npm CLI exchanges the runner's OIDC token for a
#     short-lived publish credential. No long-lived secret to leak or rotate.
#
# Release flow:
#   - bump version in package.json
#   - commit and push to main
#   - `git tag v<version> && git push origin v<version>`
#   - this workflow runs, verifies the tag matches package.json, and publishes.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual reruns from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # registry-url IS needed even for OIDC — it tells npm which registry
          # to authenticate against. setup-node writes an .npmrc with an empty
          # _authToken line; npm CLI ignores empty tokens and falls through to
          # OIDC discovery when run in GitHub Actions with id-token: write.

      - name: Upgrade npm (OIDC trusted publishing requires npm >= 11.5.1)
        # Node 22 LTS ships with npm 10.x, which doesn't know how to exchange
        # the runner's OIDC token for an npm publish credential — it just
        # falls through to ENEEDAUTH. npm 11.5.1+ adds trusted-publisher
        # auto-discovery.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Diagnostic — show npm/node versions
        run: |
          node --version
          npm --version

      - name: Publish with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public
