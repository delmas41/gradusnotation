# Publish @gradusmusic/notation-mcp to npm with provenance.
#
# Triggered by pushing a version tag (e.g. `git tag v0.2.3 && git push origin v0.2.3`).
# Provenance attaches a signed statement to the published tarball linking it to
# the exact GitHub commit + workflow run, so installers can verify the package
# was built by this repo (visible as a "Provenance" badge on npmjs.com).
#
# Setup once:
#   1. Generate an npm automation token (npm.com → Access Tokens → Generate New Token
#      → Granular, with "Publish" permission for the @gradusmusic scope).
#   2. Add it as a repo secret named NPM_TOKEN
#      (gh secret set NPM_TOKEN, or via the GitHub UI).
#
# Release flow:
#   - bump version in package.json
#   - commit and push to main
#   - `git tag v<version> && git push origin v<version>`
#   - this workflow runs, verifies the tag matches package.json, and publishes.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual reruns from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
